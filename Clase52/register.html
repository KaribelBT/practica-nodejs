<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acamibank / Registro</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link rel="stylesheet" href="https://getbootstrap.com/docs/4.4/examples/floating-labels/floating-labels.css"
    crossorigin="anonymous">
</head>

<body class="text-center">
  <div class="container">
    <div class="row">
      <form method="POST" class="form-signin">
        <div class="text-center mb-4">
          <h1 class="h1">ACAMIBANK</h1>
          <h2 class="h3 mb-3 font-weight-normal">Por favor registrate</h2>
          <div class="form-label-group">
            <input class="form-control mb-2" type="text" name="nombre" id="name" placeholder="Nombre" required
              autofocus>
            <label for="nombre">Nombre</label>
          </div>
          <div class="form-label-group">
            <input class="form-control mb-2" type="text" name="apellido" id="lastname" placeholder="Apellido" required
              autofocus>
            <label for="apellido">Apellido</label>
          </div>
          <div class="form-label-group">
            <input class="form-control mb-2" type="email" name="email" id="email" placeholder="Email" required
              autofocus>
            <label for="email">Email</label>
          </div>
          <div class="form-label-group">
            <input class="form-control mb-2" type="text" name="usuario" id="username" placeholder="Usuario"
              autocomplete="off" required autofocus>
            <label for="usuario">Usuario</label>
          </div>
          <div class="form-label-group">
            <input class="form-control" type="password" name="password" id="password" placeholder="Contraseña"
              autocomplete="off" required autofocus>
            <label for="password">Contraseña</label>
          </div>
        </div>
        <div class="form-label-group">
          <button class="btn btn-lg btn-primary " type="submit" id="btn-send">ENVIAR</button>
          <button class="btn btn-secondary btn-lg" id="btn-cancel">CANCELAR</button>
        </div>
      </form>
    </div>

    <!--Modal-->
    <div class="modal fade" id="errorLogin" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <p id="message"></p>
          </div>
          <div class="modal-footer">
            <button id="btn-close" type="button" class="btn btn-primary" data-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/register.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js"
      integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut"
      crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"
      integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k"
      crossorigin="anonymous"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acamibank / Cuentas</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="canonical" href="https://getbootstrap.com/docs/4.0/examples/pricing/">
</head>

<body class="text-center">
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Acamibank</h1>
        <p class="lead"> Bienvenido <span id="userCalled"></span>!</p>
    </div>
    <div class=container>
        <div class="card-deck mb-3 text-center">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal"><span id="typeAhorro"></span></h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">$<span id="balanceAhorro"></span></h1>
                    <ul class="list-unstyled mt-3 mb-4">
                        <li> CBU: <span id="cbuAhorro"></span></li>
                    </ul>
                </div>
            </div>
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal"><span id="typeCorriente"></span></h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">$<span id="balanceCorriente"></span></h1>
                    <ul class="list-unstyled mt-3 mb-4">
                        <li> CBU: <span id="cbuCorriente"></span></li>
                    </ul>
                </div>
            </div>
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal"><span id="typeProyecto"></span></h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">$<span id="balanceProyecto"></span></h1>
                    <ul class="list-unstyled mt-3 mb-4">
                        <li> CBU: <span id="cbuProyecto"></span></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <button type="button" class="btn btn-lg btn-primary" id="btn-transf">TRANSFERIR</button>
        <button type="button" class="btn btn-lg btn-secondary" id="btn-exit">SALIR</button>
    </div>
    <script src="./js/main.js"></script>
</body>

</html>
